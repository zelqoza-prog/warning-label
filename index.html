/* v18: Connection payoff polish */
.connectionHero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,90,79,.16), transparent 36%),
    linear-gradient(145deg,#171b18,#1d211f);
}
.connectionHero::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:24px;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.08) 48%,transparent 70%);
  transform:translateX(-120%);
  animation:connectionSheen 1.15s ease .35s both;
}
.connectionPayoff{
  text-align:center;
  padding:8px 0 4px;
}
.connectionPayoff .eyebrow{
  color:#d6d6dc;
}
.connectionPayoff .score{
  margin:10px 0 0;
  font-size:82px;
  line-height:.95;
  transform-origin:center;
}
.connectionPayoff .label{
  margin-top:8px;
  font-size:24px;
}
.connectionOneLiner{
  max-width:560px;
  margin:8px auto 0;
  color:#e4e4e8;
  font-size:15px;
  line-height:1.5;
}
.connectionQuick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.connectionQuick .quick{
  background:#17191a;
  border:1px solid #30383a;
  border-radius:14px;
  padding:13px;
  text-align:left;
}
.connectionQuick .quick span{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:10px;
}
.connectionQuick .quick b{
  display:block;
  margin-top:5px;
  font-size:14px;
  line-height:1.35;
}
.connectionDetailsToggle{
  margin-top:14px;
  background:#202126;
  color:#fff;
  border:1px solid #34353b;
}
.connectionDetails{
  display:none;
  margin-top:12px;
}
.connectionDetails.show{
  display:block;
  animation:detailsIn .35s ease both;
}
.score-pop{
  animation:scorePop .85s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes scorePop{
  0%{opacity:0;transform:scale(.72) translateY(10px)}
  60%{opacity:1;transform:scale(1.08) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes connectionSheen{
  to{transform:translateX(120%)}
}
@keyframes detailsIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:600px){
  .connectionHero{padding:18px 14px}
  .connectionPayoff .score{font-size:68px}
  .connectionPayoff .label{font-size:21px}
  .connectionOneLiner{font-size:14px}
  .connectionQuick{grid-template-columns:1fr}
  .compareGrid{grid-template-columns:1fr 1fr}
  .person{padding:12px}
  .person .label{font-size:22px}
  .traitRow{padding-top:2px}
}

    if(gap<min){min=gap;same=k}
    if(gap>max){max=gap;diff=k}
  });
  return {same,diff,sameLabel:names[same],diffLabel:names[diff]};
}

function crossProfileRead(aIdx,bIdx,rel,aTraits,bTraits){
  const A=PROFILE_DYNAMICS[lang][aIdx];
  const B=PROFILE_DYNAMICS[lang][bIdx];
  const t=strongestTraitMatch(aTraits,bTraits);

  if(lang==="es"){
    return{
      good:`${A.short} aporta ${A.gift}; ${B.short} aporta ${B.gift}. Su punto de coincidencia más natural está en ${t.sameLabel.toLowerCase()}, y ahí es donde la relación suele sentirse fácil.`,
      loop:`El riesgo aparece en ${t.diffLabel.toLowerCase()}: ${A.short} puede ${A.shadow}, mientras ${B.short} puede ${B.shadow}. Si ninguno explica su intención, cada uno termina reaccionando al estilo del otro en vez de a lo que realmente quiso decir.`,
      a:`${A.short}: recuerda que la otra persona necesita ${B.need}. Ajusta tu señal antes de asumir que te entendió.`,
      b:`${B.short}: recuerda que la otra persona necesita ${A.need}. Pregunta antes de convertir una reacción en una conclusión.`,
      rule:`Cuando choquen en ${t.diffLabel.toLowerCase()}, una pregunta clara vale más que diez interpretaciones.`
    };
  }

  return{
    good:`${A.short} brings ${A.gift}; ${B.short} brings ${B.gift}. Your easiest common ground is ${t.sameLabel.toLowerCase()}, and that is where the relationship tends to feel natural.`,
    loop:`The risk shows up around ${t.diffLabel.toLowerCase()}: ${A.short} may ${A.shadow}, while ${B.short} may ${B.shadow}. If neither explains intent, each person starts reacting to the other's style instead of what they actually meant.`,
    a:`${A.short}: remember that the other person needs ${B.need}. Adjust your signal before assuming they understood it.`,
    b:`${B.short}: remember that the other person needs ${A.need}. Ask before turning one reaction into a conclusion.`,
    rule:`When you clash around ${t.diffLabel.toLowerCase()}, one clear question beats ten interpretations.`
  };
}

function getPairRead(aIdx,bIdx,rel,aTraits,bTraits){
  if(aIdx===bIdx) return sameProfileRead(aIdx,rel,aTraits,bTraits);
  return crossProfileRead(aIdx,bIdx,rel,aTraits,bTraits);
}

function renderConnection(c){

  const comp=compatibility(c,currentResult);
  const them=profile(c.idx);
  const you=profile(currentResult.idx);
  const pair=getPairRead(c.idx,currentResult.idx,c.rel,c.traits,currentResult.traits);
  const relNote=relationshipModifier(c.rel);

  $("connectionAuto").classList.remove("hidden");
  $("connectionDetails").classList.remove("show");
  $("connectionDetailsToggle").innerText=tx("showDetails");

  $("compareTitle").innerText=pairDisplayTitle(c.idx,currentResult.idx);
  $("compatScore").innerText=comp.score+"%";

  $("compatCopy").innerText=relNote;

  $("quickGood").innerText=pair.good;

  $("positiveTitle").innerText=lang==="es"?"Lo que realmente funciona entre ustedes":"What actually works between you";

  $("themScore").innerText=c.pct+"%";
  $("themLabel").innerText=them[0];
  $("youScore").innerText=currentResult.pct+"%";
  $("youLabel").innerText=you[0];

  $("whyText").innerText=pair.good;
  $("whereText").innerText=pair.loop;

  $("theyDoText").innerText=pair.b;

  renderTraits(c.traits,currentResult.traits);

  const scoreEl=$("compatScore");
  scoreEl.classList.remove("score-pop");

}
