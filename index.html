.wrap{

.topbar{

}

.hero{

h1{

}

button{

.result{

}

.warning{

.score{

}

.label{

  font-weight:900;

.tag{

.linkactions{

.positive{

.traitRow{

.traitLine{

.track{

};

}

function traitFit(
a,
b
){

if(
!a
||
!b
){

return null;

}


const k=[
"openness",
"directness",
"attachment",
"regulation",
"social"
];


const avg=
k.reduce(
(s,x)=>
s+
Math.abs(
(a[x]||0)
-
(b[x]||0)
),
0
)
/
k.length;


return Math.max(
0,
Math.min(
100,
Math.round(
100-
avg*5
)
)
);

}


function compatibility(
a,
b
){

const f=
traitFit(
a.traits,
b.traits
);


let score=
Math.round(
80
-
Math.abs(
a.pct-b.pct
)*.25
+
(
f!==null
?
(f-50)*.18
:
0
)
+
(
a.idx===b.idx
?
5
:
0
)
);


score=
Math.max(
55,
Math.min(
97,
score
)
);


const label=
lang==="es"

?(
score>=90
?
