<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WARNING LABEL — 30-Second Self-Awareness Test</title>
<style>
:root{
  --bg:#0b0b0c;--card:#151518;--text:#f5f5f2;--muted:#aaaab2;
  --line:#2a2a30;--accent:#ff5a4f
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.brand span{color:var(--accent)}
.lang-toggle{display:flex;gap:6px}
.langbtn{width:auto;padding:8px 11px;border-radius:10px;background:#1d1d22;color:#bbb;border:1px solid #303037;font-size:12px}
.langbtn.active{color:#fff;border-color:var(--accent)}
.hero{padding:66px 0 34px}
.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
h1{font-size:54px;line-height:.96;margin:12px 0 18px;letter-spacing:-.04em}
p{color:var(--muted);font-size:18px;line-height:1.5}
button{width:100%;border:0;border-radius:16px;padding:17px 18px;font-weight:800;font-size:17px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#242429;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:20px}
.hidden{display:none}
.backbar{display:flex;justify-content:flex-start;margin:6px 0 14px}
.backbtn{width:auto;padding:10px 14px;border-radius:12px;background:#1d1d22;color:#fff;border:1px solid #303037;font-size:14px}
.progress{height:5px;background:#222;border-radius:9px;overflow:hidden;margin:22px 0}
.bar{height:100%;background:var(--accent);width:0}
.qnum{color:var(--muted);font-size:13px}
.question{font-size:25px;font-weight:800;margin:8px 0 18px}
.option{display:block;width:100%;padding:15px 16px;margin:10px 0;background:#1e1e22;border:1px solid #303037;border-radius:14px;color:#fff;text-align:left;font-size:16px}
.option:hover{border-color:#666}
.result{text-align:center}
.warning{display:inline-block;border:2px solid var(--accent);color:var(--accent);font-weight:900;padding:7px 12px;border-radius:9px;letter-spacing:.08em;position:relative;overflow:hidden}
.warning:after{content:"";position:absolute;inset:-2px auto -2px -40%;width:34%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 2.8s ease-in-out infinite 1s}
.score{font-size:74px;font-weight:950;letter-spacing:-.06em;margin:18px 0 0}
.label{font-size:31px;font-weight:900;margin:4px 0 15px}
.tag{font-size:19px;color:#f3f3f5;line-height:1.55;font-weight:500}
.sharecard{margin:24px 0;background:#f3eddf;color:#111;border-radius:22px;padding:26px;text-align:left}
.sharecard .warning{color:#111;border-color:#111}
.sharecard .score{font-size:58px}
.sharecard .small{font-size:13px;color:#555;margin-top:20px}
.sharemenu{display:none;margin-top:12px;background:#1b1b1f;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left}
.sharemenu.show{display:block}
.sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sharebtn{background:#242429;color:#fff;border:1px solid #33343a;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:800}
.sharestatus,.challenge-status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;text-align:center}
.success{color:#9be7b0}
.error{color:#ff9c96}
.paywall{text-align:left;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.payrow{display:flex;justify-content:space-between;padding:10px 0;color:#ddd}
.blur{filter:blur(5px);user-select:none}
.report-wrap{margin-top:22px;text-align:left}
.report-hero{border-radius:24px;padding:28px;background:linear-gradient(135deg,#17171b,#23232a);border:1px solid var(--line)}
.report-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.report-title{font-size:36px;font-weight:950;margin:8px 0 10px}
.report-sub{font-size:16px;color:#cfcfd5;line-height:1.5}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.metric{background:#1d1d22;border:1px solid #303038;border-radius:16px;padding:16px}
.metric b{display:block;font-size:24px;margin-top:4px}
.section-card{background:#17171b;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}
.section-card h3{margin:0 0 8px;font-size:20px}
.section-card p{font-size:15px;margin:0}
.action{display:flex;gap:12px;margin-top:14px}
.action-num{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:900}
.relationship-picker{margin-top:14px;padding:16px;border-radius:16px;background:#1c1c21;border:1px solid #303038}
.relationship-picker .title{font-size:13px;color:var(--muted);margin-bottom:10px}
.relationship-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.relbtn{padding:11px 8px;border-radius:12px;background:#242429;color:#fff;border:1px solid #35353c;font-size:13px}
.relbtn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.connection-launch{margin-top:14px}
.connection-setup{display:none;margin-top:14px}
.connection-setup.show{display:block}
.connection-preview{margin-top:12px;padding:16px;border-radius:16px;background:linear-gradient(145deg,#18181d,#202027);border:1px solid #303038}
.connection-preview .eyeline{color:#aeb0b9;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.connection-preview h4{margin:6px 0 8px;font-size:18px}
.connection-preview p{margin:0;font-size:14px;color:#d4d4da}
.connection-link-box{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#111216;border:1px solid #303038}
.connection-link-box.show{display:block}
.connection-link-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #34343c;background:#0d0e11;color:#fff;font-size:13px}
.connection-link-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.circle-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:#17171b;border:1px dashed #3a3a42;color:var(--muted);font-size:13px;line-height:1.45}
.shared-shell{text-align:center;padding-top:18px}
.shared-kicker{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.shared-title{font-size:38px;line-height:1.02;font-weight:950;letter-spacing:-.04em;margin:10px 0 8px}
.shared-copy{color:#d2d2d8;font-size:16px;line-height:1.5}
.shared-result-card{margin:20px 0;background:linear-gradient(160deg,#f5efe4,#e7ddcf);color:#111;border-radius:24px;padding:28px;text-align:left}
.shared-result-card .warning{color:#111;border-color:#111}
.shared-result-card .score{font-size:66px}
.connection-card{margin-top:16px;padding:22px;border-radius:22px;background:linear-gradient(145deg,#19191e,#23232a);border:1px solid var(--line)}
.connection-kicker{color:var(--muted);font-size:12px;letter-spacing:.13em;text-transform:uppercase}
.connection-title{font-size:30px;font-weight:950;letter-spacing:-.03em;margin:8px 0 4px}
.connection-score{font-size:68px;font-weight:950;letter-spacing:-.06em;margin-top:14px}
.connection-label{font-size:22px;font-weight:900}
.connection-copy{color:#d1d1d8;line-height:1.5;margin-top:8px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.compare-person{background:#1c1c21;border:1px solid #303038;border-radius:16px;padding:16px}
.compare-person .who{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.compare-person .big{font-size:28px;font-weight:950;margin:6px 0 2px}
.compare-person .small{font-size:13px;color:#c8c8ce}
.positive-read{margin-top:16px;padding:18px;border-radius:18px;background:linear-gradient(145deg,#1b211e,#1a1d1b);border:1px solid #33453a}
.positive-read h4{margin:0 0 8px;font-size:18px}
.positive-read p{margin:0;color:#d8e6dc;font-size:15px;line-height:1.5}
.connection-highlight{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.connection-highlight .item{padding:13px;border-radius:14px;background:#1c1c21;border:1px solid #303038}
.connection-highlight .item span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.connection-highlight .item b{display:block;margin-top:5px;font-size:15px}
.connection-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.connection-box{background:#1b1b20;border:1px solid #303038;border-radius:16px;padding:16px}
.connection-box h4{margin:0 0 8px;font-size:16px}
.connection-box p{font-size:14px;margin:0}
.connection-action{margin-top:12px;padding:14px 16px;border-radius:14px;background:#1d1d22;border:1px solid #303038}
.connection-action b{display:block;margin-bottom:4px}
.trait-compare{margin-top:18px;padding:18px;border-radius:18px;background:#18181d;border:1px solid var(--line)}
.trait-compare h4{margin:0 0 14px;font-size:17px}
.trait-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin:13px 0}
.trait-name{color:#d6d6dc;font-size:13px;font-weight:800}
.trait-bars{display:grid;gap:6px}
.trait-line{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center}
.trait-who{font-size:11px;color:var(--muted);text-transform:uppercase}
.trait-track{height:8px;background:#2a2a31;border-radius:999px;overflow:hidden}
.trait-fill{height:100%;border-radius:999px;background:var(--accent)}
.trait-fill.them{opacity:.55}
.trait-number{font-size:11px;color:#c9c9d0;text-align:right}
.compare-summary{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare-summary .pill{background:#1c1c21;border:1px solid #303038;border-radius:14px;padding:13px}
.compare-summary .pill span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.compare-summary .pill b{display:block;margin-top:5px;font-size:16px}

@keyframes sweep{
  0%,55%{left:-45%}
  100%{left:125%}
}

@media(max-width:600px){
  h1{font-size:44px}
  .relationship-grid{grid-template-columns:1fr 1fr}
  .metric-grid,.compare-grid,.connection-grid,.connection-highlight,.compare-summary{grid-template-columns:1fr}
  .trait-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">WARNING<span>LABEL</span></div>
    <div class="lang-toggle">
      <button id="langEN" class="langbtn" onclick="setLanguage('en')">EN</button>
      <button id="langES" class="langbtn" onclick="setLanguage('es')">ES</button>
    </div>
  </div>

  <section id="start" class="hero">
    <div id="challengeBanner" class="challenge-banner hidden card" style="text-align:left"></div>

    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="headline"></h1>
    <p data-i18n="subhead"></p>

    <button
      class="primary"
      onclick="begin()"
      data-i18n="readMe">
    </button>

    <p
      style="font-size:13px;text-align:center"
      data-i18n="disclaimer">
    </p>
  </section>


  <section id="sharedResult" class="hidden shared-shell">

    <div class="backbar">
      <button
        class="backbtn"
        onclick="exitSharedView()"
        data-i18n="back">
      </button>
    </div>

    <div
      class="shared-kicker"
      data-i18n="sharedKicker">
    </div>

    <div
      class="shared-title"
      data-i18n="sharedTitle">
    </div>

    <div
      class="shared-copy"
      data-i18n="sharedCopy">
    </div>


    <div class="shared-result-card">

      <div class="warning">
        ⚠ WARNING LABEL
      </div>

      <div
        id="sharedScore"
        class="score">
      </div>

      <div
        id="sharedLabel"
        class="label">
      </div>

      <div
        id="sharedTag"
        class="tag">
      </div>

      <div class="small">
        ZELQOZA ·
        <span data-i18n="sharedResultSmall"></span>
      </div>

    </div>


    <button
      class="secondary"
      onclick="startOwnTestFromShare()"
      data-i18n="takeOwnTest">
    </button>


    <div
      class="relationship-picker"
      style="text-align:left">

      <div
        class="title"
        data-i18n="howKnow">
      </div>

      <div class="relationship-grid">

        <button
          class="relbtn active shared-relbtn"
          onclick="setSharedRelationship('friend',this)"
          data-rel-label="friend">
        </button>

        <button
          class="relbtn shared-relbtn"
          onclick="setSharedRelationship('family',this)"
          data-rel-label="family">
        </button>

        <button
          class="relbtn shared-relbtn"
          onclick="setSharedRelationship('partner',this)"
          data-rel-label="partner">
        </button>

        <button
          class="relbtn shared-relbtn"
          onclick="setSharedRelationship('work',this)"
          data-rel-label="work">
        </button>

      </div>

      <button
        class="primary"
        style="margin-top:12px"
        onclick="startConnectionFromSharedResult()"
        data-i18n="takeAndCompare">
      </button>

    </div>

  </section>


  <section id="quiz" class="hidden">

    <div class="backbar">
      <button
        class="backbtn"
        onclick="goBack()"
        data-i18n="back">
      </button>
    </div>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <div class="card">

      <div
        id="qnum"
        class="qnum">
      </div>

      <div
        id="question"
        class="question">
      </div>

      <div id="options"></div>

    </div>

  </section>


  <section
    id="result"
    class="hidden result">

    <div class="backbar">
      <button
        class="backbtn"
        onclick="goBack()"
        data-i18n="back">
      </button>
    </div>


    <div class="card">

      <div class="warning">
        ⚠ WARNING LABEL
      </div>

      <div
        id="score"
        class="score">
      </div>

      <div
        id="label"
        class="label">
      </div>

      <div
        id="tag"
        class="tag">
      </div>


      <div class="sharecard">

        <div class="warning">
          ⚠ WARNING LABEL
        </div>

        <div
          id="shareScore"
          class="score">
        </div>

        <div
          id="shareLabel"
          class="label">
        </div>

        <div
          id="shareTag"
          class="tag">
        </div>

        <div class="small">
          ZELQOZA ·
          <span data-i18n="seeMine"></span>
        </div>

      </div>


      <button
        class="secondary"
        onclick="toggleShareMenu()"
        data-i18n="shareMyResult">
      </button>


      <div
        id="shareMenu"
        class="sharemenu">

        <div class="sharegrid">

          <button
            class="sharebtn"
            onclick="copyShareLink()"
            data-i18n="copyResultLink">
          </button>

          <button
            class="sharebtn"
            onclick="shareWhatsApp()"
            data-i18n="sendWhatsApp">
          </button>

          <button
            class="sharebtn"
            onclick="saveStoryCard()"
            data-i18n="instagramStory">
          </button>

          <button
            class="sharebtn"
            onclick="shareX()"
            data-i18n="postX">
          </button>

          <button
            class="sharebtn"
            onclick="shareFacebook()"
            data-i18n="shareFacebook">
          </button>

          <button
            class="sharebtn"
            onclick="nativeShare()"
            data-i18n="moreShare">
          </button>

        </div>

        <div
          id="shareStatus"
          class="sharestatus">
        </div>

      </div>


      <div class="paywall">

        <div
          style="font-size:23px;font-weight:900"
          data-i18n="deepReadTitle">
        </div>

        <p
          style="font-size:15px"
          data-i18n="deepReadCopy">
        </p>


        <div class="payrow">
          <span data-i18n="misread"></span>
          <span class="blur">Your signal</span>
        </div>

        <div class="payrow">
          <span data-i18n="strongestPattern"></span>
          <span class="blur">Your pattern</span>
        </div>

        <div class="payrow">
          <span data-i18n="nextMove"></span>
          <span class="blur">Your action</span>
        </div>


        <button
          class="primary"
          onclick="unlockDemo()"
          data-i18n="unlockDeepRead">
        </button>

        <div
          class="mini"
          style="text-align:center;margin-top:8px"
          data-i18n="previewMode">
        </div>


        <div
          id="fullReport"
          class="report-wrap hidden">


          <div class="report-hero">

            <div
              class="report-kicker"
              data-i18n="deepReadTitle">
            </div>

            <div
              id="reportTitle"
              class="report-title">
            </div>

            <div
              class="report-sub">
            </div>


            <div class="metric-grid">

              <div class="metric">
                <span data-i18n="peopleReadYouAs"></span>
                <b id="metricMisread"></b>
              </div>

              <div class="metric">
                <span data-i18n="realStrength"></span>
                <b id="metricStrength"></b>
              </div>

              <div class="metric">
                <span data-i18n="growthEdge"></span>
                <b id="metricEdge"></b>
              </div>

              <div class="metric">
                <span data-i18n="socialRisk"></span>
                <b id="metricRisk"></b>
              </div>

            </div>

          </div>


          <div class="section-card">

            <h3 data-i18n="whatMisunderstand"></h3>

            <p id="misunderstandText"></p>

          </div>


          <div class="section-card">

            <h3 data-i18n="whatGetsWay"></h3>

            <p id="frictionText"></p>

          </div>


          <div class="section-card">

            <h3 data-i18n="threeMoves"></h3>

            <div id="actionsContainer"></div>

          </div>


          <div class="section-card">

            <h3 data-i18n="connectionRead"></h3>

            <p data-i18n="connectionReadIntro"></p>


            <div class="connection-launch">

              <button
                class="primary"
                onclick="openConnectionSetup()"
                data-i18n="startConnection">
              </button>

            </div>


            <div
              id="connectionSetup"
              class="connection-setup">


              <div class="relationship-picker">

                <div
                  class="title"
                  data-i18n="whatPerson">
                </div>


                <div class="relationship-grid">

                  <button
                    class="relbtn active"
                    onclick="setRelationship('friend',this)"
                    data-rel-label="friend">
                  </button>

                  <button
                    class="relbtn"
                    onclick="setRelationship('family',this)"
                    data-rel-label="family">
                  </button>

                  <button
                    class="relbtn"
                    onclick="setRelationship('partner',this)"
                    data-rel-label="partner">
                  </button>

                  <button
                    class="relbtn"
                    onclick="setRelationship('work',this)"
                    data-rel-label="work">
                  </button>

                </div>

              </div>


              <div
                id="connectionPreview"
                class="connection-preview">

                <div class="eyeline"></div>

                <h4 id="connectionPreviewTitle"></h4>

                <p id="connectionPreviewText"></p>

              </div>


              <button
                class="primary"
                style="margin-top:12px"
                onclick="createConnectionLink()"
                data-i18n="createPrivateLink">
              </button>


              <div
                id="challengeStatus"
                class="challenge-status">
              </div>


              <div
                id="connectionLinkBox"
                class="connection-link-box">

                <input
                  id="connectionLinkInput"
                  type="text"
                  readonly>


                <div class="connection-link-actions">

                  <button
                    class="secondary"
                    onclick="copyConnectionLink()"
                    data-i18n="copyLink">
                  </button>

                  <button
                    class="secondary"
                    onclick="shareChallenge()"
                    data-i18n="shareIt">
                  </button>

                </div>

              </div>


              <div
                class="circle-note"
                data-i18n="connectionNote">
              </div>

            </div>

          </div>


          <div
            id="comparisonSection"
            class="section-card hidden">


            <div
              class="connection-kicker"
              data-i18n="connectionRead">
            </div>


            <div
              id="comparisonIntro"
              class="connection-title">
            </div>


            <div class="connection-card">

              <div
                id="compatScore"
                class="connection-score">
              </div>

              <div
                id="compatLabel"
                class="connection-label">
              </div>

              <div
                id="compatCopy"
                class="connection-copy">
              </div>


              <div class="positive-read">

                <h4 id="positiveConnectionTitle"></h4>

                <p id="positiveConnectionCopy"></p>


                <div class="connection-highlight">

                  <div class="item">

                    <span data-i18n="sharedTrait"></span>

                    <b id="sharedStrength"></b>

                  </div>


                  <div class="item">

                    <span data-i18n="balance"></span>

                    <b id="balanceStrength"></b>

                  </div>

                </div>

              </div>


              <div class="compare-grid">

                <div class="compare-person">

                  <div
                    class="who"
                    data-i18n="them">
                  </div>

                  <div
                    class="big"
                    id="challengerScore">
                  </div>

                  <div
                    class="small"
                    id="challengerLabel">
                  </div>

                </div>


                <div class="compare-person">

                  <div
                    class="who"
                    data-i18n="you">
                  </div>

                  <div
                    class="big"
                    id="friendScore">
                  </div>

                  <div
                    class="small"
                    id="friendLabel">
                  </div>

                </div>

              </div>


              <div class="connection-grid">

                <div class="connection-box">

                  <h4 data-i18n="whyClick"></h4>

  if(

    traits.directness<=0
  ){
    return 1;

  if(
    traits.social>=3 &&
    traits.regulation<=1

    return 2;

  if(
    traits.attachment<=-3

    return 3;

  if(
    traits.directness>=4

    return 4;

  if(
    traits.regulation<=-2 &&
    traits.social<=1
  ){
    return 5;
  }

  if(

    traits.openness>=1

    return 6;

  return 7;

}

  const pct=

async function copyTextReliable(text){

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator
        .clipboard
        .writeText(text);

      return true;

    }

  }catch(e){}


  try{

    const area=
      document.createElement(
        "textarea"
      );


    area.value=text;

    area.setAttribute(
      "readonly",
      ""
    );


    area.style.position=
      "fixed";

    area.style.opacity=
      "0";

    area.style.pointerEvents=
      "none";


    document.body.appendChild(
      area
    );


    area.focus();

    area.select();


    const ok=
      document.execCommand(
        "copy"
      );


    document.body.removeChild(
      area
    );


    if(ok){

      return true;

    }

  }catch(e){}


  return false;

}

  .map(k=>
    Math.round(
      (x||{})[k]||0
    )
  )
  .join(",");

}


function parseTraits(v){

  if(!v){

    return null;

  }


  const a=
    v
    .split(",")
    .map(Number);


  if(
    a.length!==5 ||
    a.some(Number.isNaN)
  ){

    return null;

  }


  return{
    openness:a[0],
    directness:a[1],
    attachment:a[2],
    regulation:a[3],
    social:a[4]
  };

}

function traitFit(
  a,
  b
){

  if(
    !a ||
    !b
  ){

    return null;

  }


  const keys=[
    "openness",
    "directness",
    "attachment",
    "regulation",
    "social"
  ];


  const avg=
    keys.reduce(
      (s,k)=>
        s+
        Math.abs(
          (a[k]||0)-
          (b[k]||0)
        ),
      0
    )
    /keys.length;


  return Math.max(
    0,
    Math.min(
      100,
      Math.round(
        100-
        avg*5
      )
    )
  );

}


function compatibility(
  a,
  b
){

  const f=
    traitFit(
      a.traits,
      b.traits
    );


  let score=
    Math.round(
      80
      -
      Math.abs(
        a.pct-b.pct
      )*.25
      +
      (
        f!==null
        ?(f-50)*.18
        :0
      )
      +
      (
        a.idx===b.idx
        ?5
        :0
      )
    );


  score=
    Math.max(
      55,
      Math.min(
        97,
        score
      )
    );


  let label;


  if(lang==="es"){

    label=
      score>=90
      ?"Conexión muy fuerte"

      :score>=82
      ?"Conexión fuerte"

      :score>=72
      ?"Buena conexión con algo de fricción"

      :score>=62
      ?"Diferentes, pero puede funcionar"

      :"Sistemas operativos distintos";

  }else{

    label=
      score>=90
      ?"Very strong fit"

      :score>=82
      ?"Strong connection"

      :score>=72
      ?"Good with some friction"

      :score>=62
      ?"Different but workable"

      :"Different operating systems";

  }


  return{
    score,
    label,
    fit:f
  };

}

      "Ritmos distintos de comunicación pueden parecer desinterés o control.",
      "Aclara fechas, responsabilidades y resultados.",
      "Da contexto con tus solicitudes.",
      "Hagan visibles las expectativas. La claridad gana."
    ]

  };


  return(
    (lang==="es"?es:en)[rel] ||
    (lang==="es"?es:en).friend
  );

}


function traitNames(){

  return lang==="es"

  ?{
    openness:"Apertura",
    directness:"Directitud",
    attachment:"Cercanía",
    regulation:"Serenidad",
    social:"Energía social"
  }

  :{
    openness:"Openness",
    directness:"Directness",
    attachment:"Closeness",
    regulation:"Composure",
    social:"Social energy"
  };

}


function renderTraitComparison(
  a,
  b
){

  const c=
    document.getElementById(
      "traitCompareRows"
    );


  const labels=
    traitNames();


  const keys=
    Object.keys(
      labels
    );


  c.innerHTML="";


  let min={
    k:null,
    g:999
  };


  let max={
    k:null,
    g:-1
  };


  keys.forEach(k=>{

    const av=
      Math.round(
        (
          (
            a?.[k]||0
          )+
          10
        )
        /20
        *100
      );


    const bv=
      Math.round(
        (
          (
            b?.[k]||0
          )+
          10
        )
        /20
        *100
      );


    const g=
      Math.abs(
        av-bv
      );


    if(g<min.g){

      min={
        k,
        g
      };

    }


    if(g>max.g){

      max={
        k,
        g
      };

    }


    c.innerHTML+=`

      <div class="trait-row">

        <div class="trait-name">
          ${labels[k]}
        </div>

        <div class="trait-bars">

          <div class="trait-line">

            <div class="trait-who">
              ${t("them")}
            </div>

            <div class="trait-track">

              <div
                class="trait-fill them"
                style="width:${av}%">
              </div>

            </div>

            <div class="trait-number">
              ${av}
            </div>

          </div>


          <div class="trait-line">

            <div class="trait-who">
              ${t("you")}
            </div>

            <div class="trait-track">

              <div
                class="trait-fill"
                style="width:${bv}%">
              </div>

            </div>

            <div class="trait-number">
              ${bv}
            </div>

          </div>

        </div>

      </div>

    `;

  });


  document
    .getElementById(
      "biggestSimilarity"
    )
    .innerText=
    labels[min.k];


  document
    .getElementById(
      "biggestDifference"
    )
    .innerText=
    labels[max.k];


  document
    .getElementById(
      "sharedStrength"
    )
    .innerText=
    labels[min.k];


  document
    .getElementById(
      "balanceStrength"
    )
    .innerText=
    labels[max.k];

}

async function shareComparison(){

  const c=
    getIncomingChallenge();


  if(!c){

    return;

  }


  const comp=
    compatibility(
      c,
      currentResult
    );


  const text=
    lang==="es"

    ?`Nuestra lectura de conexión en WARNING LABEL: ${comp.score}%.`

    :`Our WARNING LABEL Connection Read: ${comp.score}%.`;


  if(navigator.share){

    try{

      await navigator.share({
        title:"Warning Label Connection",
        text,
        url:publicBaseUrl()
      });


      return;

    }catch(e){}

  }


  await copyTextReliable(
    text+
    " "+
    publicBaseUrl()
  );

}


function restartTest(){

  clearState();


  document
    .getElementById(
      "result"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "quiz"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "fullReport"
    )
    .classList
    .add("hidden");


  history.replaceState(
    null,
    "",
    publicBaseUrl()
  );


  document
    .getElementById(
      "start"
    )
    .classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

  if(

  }

  }


  const challenge=

  if(challenge){

  updateConnectionPreview(

  );

})();
