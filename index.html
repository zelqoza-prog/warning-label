/* v18: Connection payoff polish */
.connectionHero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,90,79,.16), transparent 36%),
    linear-gradient(145deg,#171b18,#1d211f);
}
.connectionHero::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:24px;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.08) 48%,transparent 70%);
  transform:translateX(-120%);
  animation:connectionSheen 1.15s ease .35s both;
}
.connectionPayoff{
  text-align:center;
  padding:8px 0 4px;
}
.connectionPayoff .eyebrow{
  color:#d6d6dc;
}
.connectionPayoff .score{
  margin:10px 0 0;
  font-size:82px;
  line-height:.95;
  transform-origin:center;
}
.connectionPayoff .label{
  margin-top:8px;
  font-size:24px;
}
.connectionOneLiner{
  max-width:560px;
  margin:8px auto 0;
  color:#e4e4e8;
  font-size:15px;
  line-height:1.5;
}
.connectionQuick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.connectionQuick .quick{
  background:#17191a;
  border:1px solid #30383a;
  border-radius:14px;
  padding:13px;
  text-align:left;
}
.connectionQuick .quick span{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:10px;
}
.connectionQuick .quick b{
  display:block;
  margin-top:5px;
  font-size:14px;
  line-height:1.35;
}
.connectionDetailsToggle{
  margin-top:14px;
  background:#202126;
  color:#fff;
  border:1px solid #34353b;
}
.connectionDetails{
  display:none;
  margin-top:12px;
}
.connectionDetails.show{
  display:block;
  animation:detailsIn .35s ease both;
}
.score-pop{
  animation:scorePop .85s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes scorePop{
  0%{opacity:0;transform:scale(.72) translateY(10px)}
  60%{opacity:1;transform:scale(1.08) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes connectionSheen{
  to{transform:translateX(120%)}
}
@keyframes detailsIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:600px){
  .connectionHero{padding:18px 14px}
  .connectionPayoff .score{font-size:68px}
  .connectionPayoff .label{font-size:21px}
  .connectionOneLiner{font-size:14px}
  .connectionQuick{grid-template-columns:1fr}
  .compareGrid{grid-template-columns:1fr 1fr}
  .person{padding:12px}
  .person .label{font-size:22px}
  .traitRow{padding-top:2px}
}

<div class="wrap">
  <div class="topbar">
    <div class="brand">WARNING<span>LABEL</span></div>
    <div class="langs">

  </div>

  <section id="start" class="hero">

  </section>

  <section id="quiz" class="hidden">
    <div class="backbar"><button id="quizBack" class="backbtn" onclick="goBack()"></button></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="card">
      <div id="qnum" class="qnum"></div>
      <div id="question" class="question"></div>
      <div id="options"></div>
    </div>
  </section>

  <section id="result" class="result hidden">
    <div class="backbar"><button id="resultBack" class="backbtn" onclick="goBack()"></button></div>
    <div class="card">
      <div class="warning warning-label-text">YOUR WARNING LABEL</div>

      <div id="label" class="label"></div>

          <div class="quick">

            <b id="quickWatch"></b>
          </div>
        </div>

        <div id="connectionDetails" class="connectionDetails">

            <p id="positiveCopy"></p>
          </div>

          <div class="person">

            <div id="themScore" class="label"></div>
            <div id="themLabel"></div>
          </div>
          <div class="person">
            <div id="youText" class="mini"></div>
            <div id="youScore" class="label"></div>
            <div id="youLabel"></div>
          </div>
        </div>

        <div id="traitRows"></div>

        <div class="section"><h3 id="whyTitle"></h3><p id="whyText"></p></div>
        <div class="section"><h3 id="whereTitle"></h3><p id="whereText"></p></div>
        <div class="section"><h3 id="youDoTitle"></h3><p id="youDoText"></p></div>
        <div class="section"><h3 id="theyDoTitle"></h3><p id="theyDoText"></p></div>
          <div class="section"><h3 id="ruleTitle"></h3><p id="ruleText"></p></div>
        </div>
      </div>

      <div class="sharecard">
        <div class="warning warning-label-text">YOUR WARNING LABEL</div>
        <div id="shareScore" class="score"></div>
        <div id="shareLabel" class="label"></div>
        <div id="shareTag" class="tag"></div>
        <div class="mini">ZELQOZA · <span id="seeMine"></span></div>
      </div>

      <button id="shareBtn" class="secondary" onclick="toggleShare()"></button>
      <div id="shareMenu" class="sharemenu">
        <div class="sharegrid">
          <button id="copyResultBtn" class="sharebtn" onclick="copyResultLink()"></button>
          <button id="whatsappBtn" class="sharebtn" onclick="shareWhatsApp()"></button>
          <button id="facebookBtn" class="sharebtn" onclick="shareFacebook()"></button>
          <button id="moreBtn" class="sharebtn" onclick="nativeShare()"></button>
        </div>
        <div id="shareStatus" class="status"></div>
      </div>

      <div class="paywall">
        <h3 id="deepTitle"></h3>
        <p id="deepCopy"></p>
        <div class="payrow"><span id="misreadLabel"></span><span class="blur">xxxxx</span></div>
        <div class="payrow"><span id="patternLabel"></span><span class="blur">xxxxx</span></div>
        <div class="payrow"><span id="moveLabel"></span><span class="blur">xxxxx</span></div>
        <button id="unlockBtn" class="primary" onclick="unlockDeepRead()"></button>
        <div id="previewNote" class="mini" style="text-align:center;margin-top:8px"></div>
      </div>

      <div id="report" class="report hidden">
        <div class="reportHero">
          <div id="reportTitle" class="reportTitle"></div>
          <div id="reportTag" class="tag"></div>
          <div class="metricGrid">
            <div class="metric"><span id="m1"></span><b id="mv1"></b></div>
            <div class="metric"><span id="m2"></span><b id="mv2"></b></div>
            <div class="metric"><span id="m3"></span><b id="mv3"></b></div>
            <div class="metric"><span id="m4"></span><b id="mv4"></b></div>
          </div>
        </div>

        <div class="section"><h3 id="underTitle"></h3><p id="underText"></p></div>
        <div class="section"><h3 id="frictionTitle"></h3><p id="frictionText"></p></div>
        <div class="section"><h3 id="movesTitle"></h3><div id="moves"></div></div>

        <div class="section">
          <h3 id="connectionTitle"></h3>
          <p id="connectionIntro"></p>
          <button id="openConnectionBtn" class="primary" onclick="openConnectionSetup()"></button>

          <div id="connectionSetup" class="connectionSetup">
            <div id="whatPerson" class="mini"></div>
            <div class="relationship-grid">
              <button class="relbtn mainRel active" data-rel="friend" onclick="setRel('friend',this)"></button>
              <button class="relbtn mainRel" data-rel="family" onclick="setRel('family',this)"></button>
              <button class="relbtn mainRel" data-rel="partner" onclick="setRel('partner',this)"></button>
              <button class="relbtn mainRel" data-rel="work" onclick="setRel('work',this)"></button>
            </div>

            <div class="preview">
              <div id="previewLine" class="eyebrow"></div>
              <h4 id="previewTitle"></h4>
              <p id="previewText"></p>
            </div>

            <button id="createLinkBtn" class="primary" style="margin-top:12px" onclick="createConnectionLink()"></button>
            <div id="connectionStatus" class="status"></div>

            <div id="linkbox" class="linkbox">
              <input id="connectionInput" readonly>
              <div class="linkactions">
                <button id="copyLinkBtn" class="secondary" onclick="copyConnectionLink()"></button>
                <button id="shareLinkBtn" class="secondary" onclick="shareChallenge()"></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button id="againBtn" class="secondary" style="margin-top:18px" onclick="restartTest()"></button>
    </div>
  </section>
</div>

      a:"Habla del problema cuando todavía es un evento, no un patrón.",
      b:"No hagas que la otra persona pruebe su inocencia ante un caso que ni sabía que existía.",
      rule:"Hablen de la evidencia antes de que se convierta en veredicto."
    }
  },
  "1-4":{
    en:{
      good:"One of you tracks patterns; the other says things directly. Done well, this creates unusually clear accountability.",
      loop:"The pattern-reader brings accumulated evidence → the direct person feels prosecuted → responds sharply → the pattern-reader adds that reaction to the file.",
      a:"Bring one issue at a time, not the whole archive.",
      b:"Answer the concern without attacking the delivery.",
      rule:"One issue, one conversation, one resolution."
    },
    es:{
      good:"Uno registra patrones y el otro habla directo. Bien manejado, eso crea una responsabilidad muy clara.",
      loop:"La persona que registra patrones trae evidencia acumulada → la persona directa se siente acusada → responde fuerte → esa reacción también entra al archivo.",
      a:"Trae un problema a la vez, no todo el archivo.",
      b:"Responde a la preocupación sin atacar la forma en que llegó.",
      rule:"Un problema, una conversación, una resolución."
    }
  }
};

function genericPairRead(aIdx,bIdx){
  const a=profile(aIdx), b=profile(bIdx);
  const rel=activeChallenge?.rel||relationshipMode||"friend";
  const traitA=activeChallenge?.traits||{};
  const traitB=currentResult.traits||{};
  const names=traitNames();
  const keys=Object.keys(names);

  let biggestDiff=keys[0], biggestSame=keys[0], maxGap=-1, minGap=999;
  keys.forEach(k=>{
    const gap=Math.abs((traitA[k]||0)-(traitB[k]||0));
    if(gap>maxGap){maxGap=gap;biggestDiff=k}
    if(gap<minGap){minGap=gap;biggestSame=k}
  });

  if(lang==="es"){
    return{
      good:`Comparten suficiente terreno en ${names[biggestSame].toLowerCase()} para entenderse con facilidad, aunque sus perfiles base sean distintos.`,
      loop:`Su diferencia más fuerte está en ${names[biggestDiff].toLowerCase()}. Cuando hay tensión, cada uno puede interpretar el estilo del otro como una intención, cuando en realidad puede ser solo una forma distinta de reaccionar.`,
      a:`La persona ${a[0]} debería explicar su intención antes de asumir que su estilo se entiende solo.`,
      b:`La persona ${b[0]} debería responder a lo que se dijo ahora, no a lo que teme que signifique.`,
      rule:`Cuando difieran en ${names[biggestDiff].toLowerCase()}, hagan una pregunta antes de sacar una conclusión.`
    };
  }

  return{
    good:`You share enough ground in ${names[biggestSame].toLowerCase()} to understand each other naturally, even if your base profiles are different.`,
    loop:`Your biggest difference is ${names[biggestDiff].toLowerCase()}. Under tension, each person can mistake the other's style for an intention when it may simply be a different way of reacting.`,
    a:`The ${a[0]} person should explain intent before assuming their style is self-explanatory.`,
    b:`The ${b[0]} person should respond to what was actually said, not what they fear it means.`,
    rule:`When you differ on ${names[biggestDiff].toLowerCase()}, ask one question before making one conclusion.`
  };
}

function getPairRead(aIdx,bIdx){
  const key=pairKey(aIdx,bIdx);
  const specific=PAIR_READS[key]?.[lang]||PAIR_READS[key]?.en;
  return specific||genericPairRead(aIdx,bIdx);
}

function relationshipModifier(rel){
  const en={
    friend:"In friendship, the biggest win is making support explicit instead of assuming it is understood.",
    family:"In family, old roles can distort current intentions, so respond to who the person is now.",
    partner:"In partnership, repair speed matters more than being perfectly matched.",
    work:"At work, clarity around ownership, timing and expectations matters more than personality fit."
  };
  const es={
    friend:"En amistad, la mayor ventaja aparece cuando hacen explícito el apoyo en vez de asumir que se entiende.",
    family:"En familia, los roles antiguos pueden distorsionar las intenciones actuales, así que respondan a quien la persona es hoy.",
    partner:"En pareja, la velocidad para reparar importa más que estar perfectamente combinados.",
    work:"En trabajo, claridad sobre responsabilidades, tiempos y expectativas importa más que el encaje de personalidad."
  };
  return (lang==="es"?es:en)[rel]||(lang==="es"?es:en).friend;
}

function compatibility(a,b){const f=traitFit(a.traits,b.traits);let score=Math.round(80-Math.abs(a.pct-b.pct)*.25+(f!==null?(f-50)*.18:0)+(a.idx===b.idx?5:0));score=Math.max(55,Math.min(97,score));const label=lang==="es"?(score>=90?"Conexión muy fuerte":score>=82?"Conexión fuerte":score>=72?"Buena conexión con algo de fricción":"Diferentes, pero puede funcionar"):(score>=90?"Very strong fit":score>=82?"Strong connection":score>=72?"Good with some friction":"Different but workable");return{score,label}}
function relCopy(rel){const en={friend:["You have useful common ground and enough difference to keep the friendship interesting.","The biggest risk is assuming the other person already knows what you mean.","Be a little more explicit than feels necessary.","Give them room without disappearing.","One clear sentence prevents ten wrong stories."],family:["You share history and familiarity that can make understanding each other feel automatic — until it isn’t.","Old roles can make one person react to who the other used to be instead of who they are now.","Say what you need without assuming family should automatically know.","Listen to the current message instead of answering the old pattern.","History explains the pattern, but it does not have to control the relationship."],partner:["You can complement each other well when both people feel safe enough to be direct.","Different coping styles can get mistaken for lack of care.","Name your need before your frustration.","Respond to the need underneath the reaction.","Talk about the pattern as the enemy — not each other."],work:["Your styles can be productive when roles and expectations are explicit.","Different communication speeds can look like disengagement or control.","State deadlines and ownership clearly.","Give context with requests.","Make expectations visible."]};const es={friend:["Tienen terreno en común y suficientes diferencias para que la amistad siga siendo interesante.","El mayor riesgo es asumir que la otra persona ya sabe lo que quieres decir.","Sé un poco más explícito/a de lo que te parecería necesario.","Dale espacio sin desaparecer.","Una frase clara evita diez historias equivocadas."],family:["Comparten historia y familiaridad que pueden hacer que entenderse parezca automático — hasta que deja de serlo.","Los roles antiguos pueden hacer que uno responda a quien la otra persona era antes, en vez de a quien es hoy.","Di lo que necesitas sin asumir que por ser familia deberían saberlo automáticamente.","Escucha el mensaje actual en lugar de responder al patrón antiguo.","La historia explica el patrón, pero no tiene que controlar la relación."],partner:["Pueden complementarse bien cuando ambos se sienten seguros para ser directos.","Los estilos distintos para manejar estrés pueden confundirse con falta de interés.","Nombra tu necesidad antes que tu frustración.","Responde a la necesidad debajo de la reacción.","Hablen del patrón como el enemigo, no del otro."],work:["Sus estilos pueden ser productivos cuando roles y expectativas son explícitos.","Ritmos distintos de comunicación pueden parecer desinterés o control.","Aclara fechas y responsabilidades.","Da contexto con tus solicitudes.","Hagan visibles las expectativas."]};return (lang==="es"?es:en)[rel]}
function traitNames(){return lang==="es"?{openness:"Apertura",directness:"Directitud",attachment:"Cercanía",regulation:"Serenidad",social:"Energía social"}:{openness:"Openness",directness:"Directness",attachment:"Closeness",regulation:"Composure",social:"Social energy"}}
function renderTraits(a,b){$("traitRows").innerHTML="";const names=traitNames();Object.keys(names).forEach(k=>{const av=Math.round((((a&&a[k])||0)+10)/20*100),bv=Math.round((((b&&b[k])||0)+10)/20*100);$("traitRows").innerHTML+=`<div class="traitRow"><div class="traitLabel">${names[k]}</div><div class="traitLine"><span>${tx("them")}</span><div class="track"><div class="fill them" style="width:${av}%"></div></div><span>${av}</span></div><div class="traitLine"><span>${tx("you")}</span><div class="track"><div class="fill" style="width:${bv}%"></div></div><span>${bv}</span></div></div>`})}

function toggleConnectionDetails(){
  const details=$("connectionDetails");
  const btn=$("connectionDetailsToggle");
  const open=details.classList.toggle("show");
  btn.innerText=open?tx("hideDetails"):tx("showDetails");
}

function renderConnection(c){
  if(!c)return;

  const comp=compatibility(c,currentResult);
  const them=profile(c.idx);
  const you=profile(currentResult.idx);
  const pair=getPairRead(c.idx,currentResult.idx);
  const relNote=relationshipModifier(c.rel);

  $("connectionAuto").classList.remove("hidden");
  $("connectionDetails").classList.remove("show");
  $("connectionDetailsToggle").innerText=tx("showDetails");

  $("compareTitle").innerText=`${them[0]} + ${you[0]}`;
  $("compatScore").innerText=comp.score+"%";
  $("compatLabel").innerText=comp.label;

  $("compatCopy").innerText=lang==="es"
    ?`${relNote}`
    :`${relNote}`;

  $("quickGood").innerText=pair.good;
  $("quickWatch").innerText=pair.loop;

  $("positiveTitle").innerText=lang==="es"?"Lo que realmente funciona entre ustedes":"What actually works between you";
  $("positiveCopy").innerText=pair.good;

  $("themScore").innerText=c.pct+"%";
  $("themLabel").innerText=them[0];

  $("youScore").innerText=currentResult.pct+"%";
  $("youLabel").innerText=you[0];

  $("whyText").innerText=pair.good;
  $("whereText").innerText=pair.loop;
  $("youDoText").innerText=pair.a;
  $("theyDoText").innerText=pair.b;
  $("ruleText").innerText=pair.rule;

  renderTraits(c.traits,currentResult.traits);

  const scoreEl=$("compatScore");
  scoreEl.classList.remove("score-pop");
  void scoreEl.offsetWidth;
  scoreEl.classList.add("score-pop");
}

function restartTest(){i=0;traits={openness:0,directness:0,attachment:0,regulation:0,social:0};historyAnswers=[];currentResult={pct:0,idx:0,traits:null};clearActiveChallenge();$("result").classList.add("hidden");$("quiz").classList.add("hidden");$("report").classList.add("hidden");$("connectionAuto").classList.add("hidden");history.replaceState(null,"",base());$("start").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}

(function init(){
  const fromUrl=readChallengeFromUrl();
  if(fromUrl)saveActiveChallenge(fromUrl);else activeChallenge=loadActiveChallenge();
  applyLanguage();initChallengeBanner();updatePreview("friend");
})();
</script>
