/* v18: Connection payoff polish */
.connectionHero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,90,79,.16), transparent 36%),
    linear-gradient(145deg,#171b18,#1d211f);
}
.connectionHero::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:24px;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.08) 48%,transparent 70%);
  transform:translateX(-120%);
  animation:connectionSheen 1.15s ease .35s both;
}
.connectionPayoff{
  text-align:center;
  padding:8px 0 4px;
}
.connectionPayoff .eyebrow{
  color:#d6d6dc;
}
.connectionPayoff .score{
  margin:10px 0 0;
  font-size:82px;
  line-height:.95;
  transform-origin:center;
}
.connectionPayoff .label{
  margin-top:8px;
  font-size:24px;
}
.connectionOneLiner{
  max-width:560px;
  margin:8px auto 0;
  color:#e4e4e8;
  font-size:15px;
  line-height:1.5;
}
.connectionQuick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.connectionQuick .quick{
  background:#17191a;
  border:1px solid #30383a;
  border-radius:14px;
  padding:13px;
  text-align:left;
}
.connectionQuick .quick span{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:10px;
}
.connectionQuick .quick b{
  display:block;
  margin-top:5px;
  font-size:14px;
  line-height:1.35;
}
.connectionDetailsToggle{
  margin-top:14px;
  background:#202126;
  color:#fff;
  border:1px solid #34353b;
}
.connectionDetails{
  display:none;
  margin-top:12px;
}
.connectionDetails.show{
  display:block;
  animation:detailsIn .35s ease both;
}
.score-pop{
  animation:scorePop .85s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes scorePop{
  0%{opacity:0;transform:scale(.72) translateY(10px)}
  60%{opacity:1;transform:scale(1.08) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes connectionSheen{
  to{transform:translateX(120%)}
}
@keyframes detailsIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

const STRIPE_DEEP_READ_URL="https://buy.stripe.com/test_9B64gz0wMgA62pD4mPds400";
const DEEP_READ_STORAGE_KEY="warning_label_pending_deep_read_v1";

function savePendingDeepRead(){
  try{
    localStorage.setItem(DEEP_READ_STORAGE_KEY,JSON.stringify({
      idx:currentResult.idx,
      traits:currentResult.traits,
      lang,
      ts:Date.now()
    }));
  }catch(e){}
}

function loadPendingDeepRead(){
  try{
    const raw=localStorage.getItem(DEEP_READ_STORAGE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||!Number.isInteger(data.idx)||data.idx<0||data.idx>=PROFILES.length)return null;
    if(!data.traits||Date.now()-(data.ts||0)>2*60*60*1000)return null;
    return data;
  }catch(e){return null}
}

function clearPendingDeepRead(){
  try{localStorage.removeItem(DEEP_READ_STORAGE_KEY)}catch(e){}
}

function begin(){gaEvent("quiz_start",{entry_type:analyticsEntryType()});$("start").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){const q=QUIZ[lang][i];$("bar").style.width=(i/QUIZ[lang].length*100)+"%";$("qnum").innerText=tx("q")(i+1,QUIZ[lang].length);$("question").innerText=q[0];$("options").innerHTML="";q[1].forEach(([text,w])=>{const b=document.createElement("button");b.className="option";b.innerText=text;b.onclick=()=>choose(w);$("options").appendChild(b)})}
function applyWeights(w,m=1){Object.keys(w).forEach(k=>traits[k]+=w[k]*m)}
function choose(w){gaEvent("quiz_question_answer",{question_number:i+1,entry_type:analyticsEntryType()});historyAnswers.push({...w});applyWeights(w);i++;i<QUIZ[lang].length?render():finish()}
function selectProfile(){if(traits.regulation>=3&&traits.directness<=0)return 0;if(traits.attachment>=2&&traits.directness<=0)return 1;if(traits.social>=3&&traits.regulation<=1)return 2;if(traits.attachment<=-3)return 3;if(traits.directness>=4)return 4;if(traits.regulation<=-2&&traits.social<=1)return 5;if(traits.social>=2&&traits.openness>=1)return 6;return 7}
function finish(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const idx=selectProfile();
  applyResult(idx,0,{...traits});
  const entryType=analyticsEntryType();
  gaEvent("quiz_complete",{entry_type:entryType,profile_key:PROFILE_KEYS[idx]});
  gaEvent("result_view",{entry_type:entryType,profile_key:PROFILE_KEYS[idx]});
  if(activeChallenge){
    gaEvent("connection_test_complete",{relation:activeChallenge.rel,profile_key:PROFILE_KEYS[idx]});
    connectionRevealed=false;
    $("connectionDivider").classList.add("hidden");
    $("connectionAuto").classList.add("hidden");
    showIncomingConnectionCTA();
  }else{
    history.replaceState(null,"",getShareUrl());
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function applyResult(idx,pct,tdata){currentResult={idx,pct:Math.min(99,pct),traits:tdata||currentResult.traits};const p=profile(idx);renderPerception(currentResult.idx);ensureScoreCaptions();$("label").innerText=$("shareLabel").innerText=p[0];$("tag").innerText=$("shareTag").innerText=p[1]}
function goBack(){if(!$("result").classList.contains("hidden")){$("result").classList.add("hidden");$("report").classList.add("hidden");$("connectionAuto").classList.add("hidden");$("connectionDivider").classList.add("hidden");if($("incomingConnectionCTA"))$("incomingConnectionCTA").classList.add("hidden");connectionRevealed=false;if(historyAnswers.length)applyWeights(historyAnswers.pop(),-1);i=QUIZ[lang].length-1;$("quiz").classList.remove("hidden");render();return}if(i===0){$("quiz").classList.add("hidden");$("start").classList.remove("hidden");return}if(historyAnswers.length)applyWeights(historyAnswers.pop(),-1);i--;render()}
function base(){return "https://zelqoza.com/"}

function parseTraits(v){if(!v)return null;const a=v.split(",").map(Number);if(a.length!==5||a.some(Number.isNaN))return null;return{openness:a[0],directness:a[1],attachment:a[2],regulation:a[3],social:a[4]}}

function getShareUrl(){const u=new URL(base());u.searchParams.set("share","1");u.searchParams.set("r",currentResult.idx);if(currentResult.traits)u.searchParams.set("t",compact(currentResult.traits));return u.toString()}

async function copyResultLink(){const ok=await copyText(getShareUrl());$("shareStatus").innerText=ok?tx("resultCopied"):"";if(ok)gaEvent("result_share",{method:"copy_link",profile_key:PROFILE_KEYS[currentResult.idx]})}

function shareWhatsApp(){gaEvent("result_share",{method:"whatsapp",profile_key:PROFILE_KEYS[currentResult.idx]});window.open("https://wa.me/?text="+encodeURIComponent(shareMessage()+" "+getShareUrl()),"_blank")}

function restoreDeepReadAfterCheckout(){
  const params=new URLSearchParams(location.search);
  if(params.get("checkout")!=="success")return false;

  const pending=loadPendingDeepRead();
  gaEvent("checkout_return",{
    product:"deep_read",
    checkout_provider:"stripe",
    checkout_mode:"test",
    payment_verified:false,
    had_pending_result:!!pending
  });

  if(!pending){
    history.replaceState(null,"",base());
    return false;
  }

  lang=pending.lang==="es"?"es":"en";
  localStorage.setItem("zelqoza_lang",lang);
  currentResult={idx:pending.idx,pct:0,traits:pending.traits};
  activeChallenge=loadActiveChallenge();
  sharedProfile=null;

  $("start").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  applyLanguage();
  applyResult(currentResult.idx,0,currentResult.traits);
  initChallengeBanner();
  initSharedResultBanner();
  updatePreview(relationshipMode);
  if(activeChallenge)showIncomingConnectionCTA();

  showDeepRead(true);
  clearPendingDeepRead();
  history.replaceState(null,"",base());
  return true;

  if(!["friend","family","partner","work"].includes(rel))rel="friend";

function pairKey(a,b){
  const x=Math.min(a,b), y=Math.max(a,b);
  return `${x}-${y}`;
}

function strongestTraitMatch(a,b){
  const names=traitNames();
  const keys=Object.keys(names);
  let same=keys[0],diff=keys[0],min=999,max=-1;
  keys.forEach(k=>{
    const gap=Math.abs(((a||{})[k]||0)-((b||{})[k]||0));
    if(gap<min){min=gap;same=k}
    if(gap>max){max=gap;diff=k}
  });
  return {same,diff,sameLabel:names[same],diffLabel:names[diff]};
}

function getPairRead(aIdx,bIdx,rel,aTraits,bTraits){
  if(aIdx===bIdx) return sameProfileRead(aIdx,rel,aTraits,bTraits);
  return crossProfileRead(aIdx,bIdx,rel,aTraits,bTraits);
}

// The Connection percentage is based on how the two answer patterns relate.
// There is no individual percentage anymore, so it is never used here.
function compatibility(a,b){
  const rel=(a&&a.rel)||"friend";
  const weights={
    friend:{openness:1.2,directness:1.1,attachment:.9,regulation:.9,social:.9},
    family:{openness:.8,directness:1.2,attachment:1.1,regulation:1.2,social:.7},
    partner:{openness:.9,directness:1.3,attachment:1.4,regulation:1.0,social:.6},
    work:{openness:1.0,directness:1.4,attachment:.5,regulation:1.2,social:.9}
  }[rel]||{openness:1,directness:1,attachment:1,regulation:1,social:1};
  let score;
  if(a&&b&&a.traits&&b.traits){
    const keys=Object.keys(weights);
    const total=keys.reduce((s,k)=>s+weights[k],0);
    const weightedGap=keys.reduce((s,k)=>s+Math.abs((a.traits[k]||0)-(b.traits[k]||0))*weights[k],0)/total;
    score=Math.round(96-weightedGap*4.6+(a.idx===b.idx?2:0));
  }else{
    score=a&&b&&a.idx===b.idx?90:80;
  }
  score=Math.max(58,Math.min(97,score));
  const label=lang==="es"
    ?(score>=90?"Conexión muy fuerte":score>=82?"Conexión fuerte":score>=72?"Buena conexión con algo de fricción":"Diferentes, pero puede funcionar")
    :(score>=90?"Very strong fit":score>=82?"Strong connection":score>=72?"Good with some friction":"Different but workable");
  return{score,label};
}
