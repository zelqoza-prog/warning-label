function applyWeights(w,m=1){
  Object.keys(w).forEach(k=>{
    if(scores[k]===undefined)scores[k]=0;
    scores[k]+=w[k]*m;
  });
}

function choose(w,idx){
  gaEvent("path_question_answer",{question_number:i+1,option_number:idx+1});
  historyAnswers.push({...w});
  if(i===4){
    lastDecisionStyle=idx===0?"fast":idx===1?"observer":idx===2?"thinker":"adapter";
  }
  applyWeights(w);
  i++;
  if(i<QUIZ[lang].length)render(); else finish();
}

function goBack(){
  if(!$("result").classList.contains("hidden")){
    $("result").classList.add("hidden");
    $("report").classList.add("hidden");
    $("paywall").classList.remove("hidden");
    if(historyAnswers.length)applyWeights(historyAnswers.pop(),-1);
    i=QUIZ[lang].length-1;
    $("quiz").classList.remove("hidden");
    render();
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(i===0){
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(historyAnswers.length)applyWeights(historyAnswers.pop(),-1);
  i--;
  render();
}

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function pctFromScore(v,min=-5,max=8){
  return Math.round(clamp(((v-min)/(max-min))*100,8,94));
}

function overallScore(){
  const raw=scores.momentum*1.25+scores.courage*.8+scores.clarity*.75+scores.alignment*1.1+scores.stability*.35;
  return Math.round(clamp(56+raw*2.15,18,91));
}

function trajectoryKey(p){
  if(p>=74)return "rising";
  if(p>=59)return "building";
  if(p>=43)return "drifting";
  return "reversal";
}

function areaScores(){
  const common=scores.momentum*.45+scores.alignment*.35+scores.clarity*.25;
  return {
    career:clamp(Math.round(61+common*3.1+scores.career*8+scores.courage*1.8),19,93),
    money:clamp(Math.round(59+common*2.7+scores.money*8+scores.stability*2.1),18,92),
    love:clamp(Math.round(62+common*2.3+scores.love*8+scores.stability*2.2),18,94),
    freedom:clamp(Math.round(60+common*2.9+scores.freedom*8+scores.courage*2.5),17,95)
  };
}

function blindKey(areas){
  const arr=Object.entries(areas).sort((a,b)=>a[1]-b[1]);
  if(scores.clarity<=-2)return "fog";
  if(lastDecisionStyle==="thinker")return "hesitation";
  if(lastDecisionStyle==="adapter")return "comfort";
  if(lastDecisionStyle==="fast"&&scores.stability<=0)return "speed";
  if(arr[0][1]<=42)return "pressure";
  return scores.courage<0?"hesitation":"comfort";
}

function changeKey(areas){
  const weakest=Object.entries(areas).sort((a,b)=>a[1]-b[1])[0][0];
  if(scores.clarity<=-2)return "define";
  if(scores.courage<=-3)return "decide";
  if(scores.momentum<=-2)return "confront";
  if(areas[weakest]<=46)return weakest;
  if(scores.stability<=-1)return "protect";
  return "remove";
}

function buildCurrent(){
  const pct=overallScore();
  const key=trajectoryKey(pct);
  const areas=areaScores();
  const sorted=Object.entries(areas).sort((a,b)=>b[1]-a[1]);
  const strongest=sorted[0][0];
  const weakest=sorted[sorted.length-1][0];
  const blind=blindKey(areas);
  const change=changeKey(areas);
  return {pct,key,areas,strongest,weakest,blind,change,decision:lastDecisionStyle};
}

function finish(){
  current=buildCurrent();
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  applyResult(current,false);
  savePending();
  gaEvent("path_complete",{trajectory:current.key,score:current.pct,weakest_area:current.weakest});
  gaEvent("path_teaser_view",{trajectory:current.key});
  window.scrollTo({top:0,behavior:"smooth"});
}

  const c=COPY[lang][r.key];

    // IMPORTANT: no real result is shown before payment.

    document.querySelector(".teaser")?.classList.remove("hidden");

    $("trajectoryLabel").innerText="";
    $("resultTag").innerText="";

    $("teaserText").innerText=t("lockedText");
    $("paywall").classList.remove("hidden");
    $("report").classList.add("hidden");
    return;
  }

  $("actualResultHeader").classList.remove("hidden");

  $("trajectory").innerText=r.pct+"%";

    ?"Esta es el área que más está afectando tu dirección actual y el patrón detrás de ella."
    :"This is the area affecting your current direction most, and the pattern behind it.";

  renderReport(r);
}

function savePending(){
  try{
    localStorage.setItem(PATH_STORAGE_KEY,JSON.stringify({
      current,
      scores,
      lang,
      decision:lastDecisionStyle,
      ts:Date.now()
    }));
  }catch(e){}
}

function loadPending(){
  try{
    const raw=localStorage.getItem(PATH_STORAGE_KEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(!d||!d.current||Date.now()-(d.ts||0)>2*60*60*1000)return null;
    return d;
  }catch(e){return null}
}

function unlockPath(){
  if(!current)return;

  if(TESTING_MODE){
    gaEvent("path_test_unlock",{trajectory:current.key,score:current.pct});
    applyResult(current,true);
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }

  savePending();
  gaEvent("path_checkout_click",{trajectory:current.key,score:current.pct});
  window.location.href=STRIPE_PATH_URL;
}

function renderReport(r){
  $("paywall").classList.add("hidden");
  $("report").classList.remove("hidden");
  const c=COPY[lang][r.key];
  const areaLabels=AREA_LABELS[lang];
  const sorted=Object.entries(r.areas).sort((a,b)=>b[1]-a[1]);
  const decision=DECISION_STYLE[lang][r.decision]||DECISION_STYLE[lang].observer;

  $("reportTitle").innerText=`${r.pct}% · ${c.label}`;
  $("reportTag").innerText=c.report;
  $("m1v").innerText=c.label;
  $("m2v").innerText=areaLabels[r.strongest];
  $("m3v").innerText=areaLabels[r.weakest];
  $("m4v").innerText=decision[0];

  $("areaRows").innerHTML="";
  sorted.forEach(([key,val])=>{
    const level=val>=68?"high":val>=48?"mid":"low";
    const row=document.createElement("div");
    row.className="area";
    row.innerHTML=`
      <div class="areaTop"><b>${areaLabels[key]}</b><span>${val}%</span></div>
      <div class="track"><div class="fill" style="width:${val}%"></div></div>
      <p>${AREA_COPY[lang][key][level]}</p>`;
    $("areaRows").appendChild(row);
  });

  $("blindText").innerText=BLIND_COPY[lang][r.blind];

  const years=lang==="es"
    ? [
      ["2026","La dirección se vuelve visible"],
      ["2027",r.pct>=59?"Las decisiones empiezan a acumularse":"La fricción empieza a costar más"],
      ["2028",r.pct>=74?"Más opciones y menos reacción":"Punto de decisión"],
      ["2029",r.pct>=59?"Una nueva normalidad":"Lo tolerado se vuelve estructura"]
    ]
    : [
      ["2026","Your direction becomes visible"],
      ["2027",r.pct>=59?"Decisions begin to compound":"Drag becomes more expensive"],
      ["2028",r.pct>=74?"More options, less reaction":"Decision point"],
      ["2029",r.pct>=59?"A new normal":"What you tolerate becomes structure"]
    ];
  $("timeline").innerHTML="";
  years.forEach(([y,txt])=>{
    const d=document.createElement("div");
    d.className="year";
    d.innerHTML=`<span>${y}</span><b>${txt}</b>`;
    $("timeline").appendChild(d);
  });

  $("changeText").innerText=CHANGE_COPY[lang][r.change];
  $("shareScore").innerText=r.pct+"% ↑";
  $("shareLabel").innerText=c.label;
  $("shareRisk").innerText=(lang==="es"?"Mayor freno: ":"Biggest drag: ")+areaLabels[r.weakest];

  gaEvent("path_full_result_view",{trajectory:r.key,score:r.pct,weakest_area:r.weakest});
}

function shareUrlFromShared(data){
  const u=new URL("https://zelqoza.com/path/");
  u.searchParams.set("s",data.score);
  u.searchParams.set("k",data.key);
  return u.pathname+u.search;
}

function shareUrl(){
  if(!current)return "https://zelqoza.com/path/";
  const u=new URL("https://zelqoza.com/path/");
  u.searchParams.set("s",current.pct);
  u.searchParams.set("k",current.key);
  return u.toString();
}

function shareText(){
  if(!current)return "";
  const label=COPY[lang][current.key].label;
  return lang==="es"
    ? `Mi Zelqoza Path: ${current.pct}% · ${label}. ¿Hacia dónde va el tuyo?`
    : `My Zelqoza Path: ${current.pct}% · ${label}. Where is yours heading?`;
}

function toggleShare(){
  $("shareMenu").classList.toggle("show");
}
async function copyResult(){
  const text=shareText()+" "+shareUrl();
  try{await navigator.clipboard.writeText(text);$("shareStatus").innerText=t("copied");}
  catch(e){$("shareStatus").innerText=text;}
  gaEvent("path_share",{method:"copy"});
}
function shareWhatsApp(){
  const url="https://wa.me/?text="+encodeURIComponent(shareText()+" "+shareUrl());
  window.open(url,"_blank","noopener");
  gaEvent("path_share",{method:"whatsapp"});
}
async function nativeShare(){
  if(navigator.share){
    try{
      await navigator.share({title:"Zelqoza — The Path",text:shareText(),url:shareUrl()});
      $("shareStatus").innerText=t("shared");
      gaEvent("path_share",{method:"native"});
      return;
    }catch(e){}
  }
  copyResult();
}

function restartTest(){
  i=0;scores=freshScores();historyAnswers=[];current=null;lastDecisionStyle="observer";
  try{localStorage.removeItem(PATH_STORAGE_KEY)}catch(e){}
  $("result").classList.add("hidden");$("report").classList.add("hidden");$("paywall").classList.remove("hidden");$("actualResultHeader").classList.add("hidden");document.querySelector(".teaser")?.classList.remove("hidden");
  $("shareMenu").classList.remove("show");$("quiz").classList.remove("hidden");
  $("bar").style.width="0%";
  const shared=sharedParams();
  const keepUrl=shared ? shareUrlFromShared(shared) : window.location.pathname;
  history.replaceState(null,"",keepUrl);
  renderSharedInvite();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
  gaEvent("path_restart");
}

/*
  Checkout-return handling:
  Configure the Stripe success redirect for The Path to:
  https://zelqoza.com/path/?checkout=success

  The full result requires BOTH the success query and a recent locally-saved
  pending Path. This prevents the normal page from revealing the result before
  checkout, while keeping the site static.
*/
function handleCheckoutReturn(){
  const params=new URLSearchParams(window.location.search);
  if(params.get("checkout")!=="success")return false;

  const pending=loadPending();
  if(!pending)return false;

  lang=pending.lang==="es"?"es":"en";
  scores=pending.scores||freshScores();
  lastDecisionStyle=pending.decision||"observer";
  current=pending.current;

  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  applyLanguage();
  applyResult(current,true);
  gaEvent("path_checkout_return",{payment_verified:false,trajectory:current.key,score:current.pct});

  params.delete("checkout");
  const clean=window.location.pathname+(params.toString()?("?"+params.toString()):"");
  history.replaceState(null,"",clean);
  window.scrollTo({top:0});
  return true;
}

applyLanguage();
if(!handleCheckoutReturn()){
  renderSharedInvite();
  render();
  const shared=sharedParams();
  gaEvent("path_landing_view",{shared_result:!!shared});
  gaEvent("path_start",{shared_result:!!shared});
  if(shared)gaEvent("path_shared_link_open",{shared_score:shared.score,shared_trajectory:shared.key});
}
</script>
